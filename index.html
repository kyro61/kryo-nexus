    <script>
      // Compatibility shim: Ensure fetch and web standard globals are writable on window in all iframe/browser environments
      (function() {
        ['fetch', 'Request', 'Response', 'Headers', 'FormData'].forEach(function(prop) {
          try {
            var current = window[prop];
            if (typeof current !== 'undefined') {
              var val = current;
              Object.defineProperty(window, prop, {
                get: function() { return val; },
                set: function(v) { val = v; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        });
      })();
    </script>
